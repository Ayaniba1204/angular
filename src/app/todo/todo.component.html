<div class="card">
  <h2>My Todos</h2>

  <div class="row">
    <input
      type="text"
      placeholder="Search"
      [(ngModel)]="searchText" />
  
    <select [(ngModel)]="filterSelection">
      <option value="all">All</option>
      <option value="completed">Completed</option>
      <option value="incomplete">Incomplete</option>
    </select>

  </div>

  <ul>
    @for (todo of filteredTodos(); track todo.id) {

      <app-todo-item
        [todo]="todo"
        (toggle)="toggleTodo($event)"
        (remove)="deleteTodo($event)" />

    } @empty {
      <li class="muted">Nothing matches.</li>
    }
  </ul>
  <p class="muted">
    Total {{ totalCount() }}.
    Done {{ completedCount() }}.
    Pending {{ incompleteCount() }}
  </p>
</div>
