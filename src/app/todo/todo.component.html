<div class="card">
  <h2>My Todos</h2>

  <p class="muted">
    Total {{ todoService.totalCount() }} ·
    Done {{ todoService.completedCount() }} ·
    Pending {{ todoService.incompleteCount() }}
  </p>

  <div class="row">
    <input type="text" placeholder="What needs doing?"
           [(ngModel)]="newTodoTitle"
           (keyup.enter)="addTodo()" />
    <button (click)="addTodo()">Add</button>
  </div>

  <div class="row">
    <input type="text" placeholder="Search"
           [(ngModel)]="todoService.searchText" />

    <select [(ngModel)]="todoService.filterSelection">
      <option value="all">All</option>
      <option value="completed">Completed</option>
      <option value="incomplete">Incomplete</option>
    </select>
  </div>

  <ul>
    @for (todo of todoService.filteredTodos(); track todo.id) {
      <app-todo-item
        [todo]="todo"
        (toggle)="todoService.toggleTodo($event)"
        (remove)="todoService.deleteTodo($event)" />
    } @empty {
      <li class="muted">Nothing matches.</li>
    }
  </ul>
</div>
